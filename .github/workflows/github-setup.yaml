# The "Run workflow" route for labels, the root issue and the stage checklists.
on:
  workflow_call:
    inputs:
      dry_run:
        description: Only show what would change
        type: boolean
        default: true

name: github-setup

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # kit-fetch-start
      - name: Fetch the kit at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .kit
      # kit-fetch-end

      - uses: r-lib/actions/setup-r@v2

      - name: Set up the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            Rscript .kit/cli/kit.R github --dry-run
          else
            Rscript .kit/cli/kit.R github --yes
          fi
