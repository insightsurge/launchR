
on:
  workflow_call:
    inputs:
      ci-report:
        description: Post the CI report comment on pull requests (one comment for every check that reports); false leaves it out, and each run's results stay in its job summary
        type: boolean
        default: true

name: secret-scan

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-26.04  # a fixed image (the Windows and macOS runners in the matrix workflows float with "latest")
    timeout-minutes: 10  # a secrets scan (recent runs: under a minute)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
          persist-credentials: false
      # launchr-fetch-end
      # The gitleaks program itself, not gitleaks-action: the action scans a push from the parent of its first commit,
      # which a repository's first push doesn't have, and it needs a paid licence for organisations.
      - name: Install gitleaks
        env:
          VERSION: 8.24.3
          SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  # from the release's checksums.txt
        run: |
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${file}" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  ${RUNNER_TEMP}/${file}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${file}" -C "${RUNNER_TEMP}" gitleaks

      # A pull request: its own commits. Anything else: the whole history of the commit that started the run, which is
      # small for a package. Not every branch: the full fetch brings in the others, and a secret in an unmerged branch
      # is that pull request's to fix. --config uses launchR's settings, never the package's .gitleaks.toml, which a pull
      # request could change to allow its own secret. The same goes for .gitleaksignore (known false alarms, one
      # fingerprint per line): the working tree's copy is deleted, and gitleaks reads a copy from a commit that was
      # reviewed instead: the base branch's on a pull request, the pushed commit's otherwise. No such file: an empty one.
      - name: Scan for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -f .gitleaksignore
          ignore="${RUNNER_TEMP}/gitleaksignore"
          : > "${ignore}"
          trusted="${BASE:-${GITHUB_SHA}}"
          git show "${trusted}:.gitleaksignore" > "${ignore}" 2>/dev/null || : > "${ignore}"
          range=(--log-opts="--no-merges ${GITHUB_SHA}")
          if [ -n "${BASE}" ]; then range=(--log-opts="--no-merges ${BASE}..${HEAD}"); fi
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 --config .launchr/.github/gitleaks.toml \
            --gitleaks-ignore-path "${ignore}" --report-format json --report-path "${RUNNER_TEMP}/gitleaks.json" \
            "${range[@]}" .

      # Where each finding is: the file, line, rule and commit, never the secret (the report is redacted and its
      # Secret and Match fields are not read). File names come from the pull request, so backticks are taken out.
      - name: Write the report
        if: always()
        env:
          STATUS: ${{ job.status }}
          OUT: ${{ runner.temp }}/report-part.md
          FOUND: ${{ runner.temp }}/gitleaks.json
        run: |
          count=0
          if [ -s "${FOUND}" ]; then count=$(jq 'length' "${FOUND}" 2>/dev/null || echo 0); fi
          case "${STATUS}" in
            success) echo "✅ **Secret scan:** passed." > "${OUT}" ;;
            cancelled) echo "⏹️ **Secret scan:** cancelled." > "${OUT}" ;;
            *)
              if [ "${count}" -gt 0 ]; then
                {
                  echo "❌ **Secret scan:** failed: ${count} possible $( [ "${count}" = 1 ] && echo secret || echo secrets ) in this pull request's commits."
                  echo
                  jq -r '.[:10][] | "- `\(.File | gsub("`"; "'"'"'"))`, line \(.StartLine): \(.RuleID) (commit \(.Commit[0:7]))"' "${FOUND}"
                  if [ "${count}" -gt 10 ]; then echo "- and $((count - 10)) more, in the run's log"; fi
                } > "${OUT}"
              else
                echo "❌ **Secret scan:** failed before it finished (see the run's log)." > "${OUT}"
              fi ;;
          esac

      - name: Keep the report
        if: always()
        uses: ./.launchr/.github/actions/pr-report-part
        with:
          name: security-1-secret-scan
          file: ${{ runner.temp }}/report-part.md

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summary only: their token can't write to the pull request.
  report:
    needs: secret-scan
    if: >-
      always() && inputs.ci-report && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request and check: a newer one replaces a waiting older one. Each rewrites the
    # whole comment from every check's latest run, so the comment stays right, and no run shows "cancelled" because
    # another check's report was waiting.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |  # .launchr is here only after eject
            .github
            .launchr
          persist-credentials: false
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
          persist-credentials: false
      # launchr-fetch-end
      - uses: ./.launchr/.github/actions/pr-report-comment
        with:
          config: .launchr/.github/pr-report.json
