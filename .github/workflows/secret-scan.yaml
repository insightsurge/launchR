
on:
  workflow_call:

name: secret-scan

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: 10  # a secrets scan (recent runs: under a minute)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
      # launchr-fetch-end
      # The gitleaks program itself, not gitleaks-action: the action scans a push from the parent of its first commit,
      # which a repository's first push doesn't have, and it needs a paid licence for organisations.
      - name: Install gitleaks
        env:
          VERSION: 8.24.3
          SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  # from the release's checksums.txt
        run: |
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${file}" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  ${RUNNER_TEMP}/${file}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${file}" -C "${RUNNER_TEMP}" gitleaks

      # A pull request: its own commits. Anything else: the whole history of the commit that started the run, which is
      # small for a package. Not every branch: the full fetch brings in the others, and a secret in an unmerged branch
      # is that pull request's to fix.
      - name: Scan for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=(--log-opts="--no-merges ${GITHUB_SHA}")
          if [ -n "${BASE}" ]; then range=(--log-opts="--no-merges ${BASE}..${HEAD}"); fi
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 "${range[@]}" .

      - name: Write the report
        if: always()
        env:
          STATUS: ${{ job.status }}
          OUT: ${{ runner.temp }}/report-part.md
        run: |
          case "${STATUS}" in
            success) echo "✅ **Secret scan:** passed." > "${OUT}" ;;
            cancelled) echo "⏹️ **Secret scan:** cancelled." > "${OUT}" ;;
            *) echo "❌ **Secret scan:** failed (see the run's log)." > "${OUT}" ;;
          esac

      - name: Keep the report
        if: always()
        uses: ./.launchr/.github/actions/pr-report-part
        with:
          name: tests-4-secret-scan
          file: ${{ runner.temp }}/report-part.md

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summary only: their token can't write to the pull request.
  report:
    needs: secret-scan
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request and check: a newer one replaces a waiting older one. Each rewrites the
    # whole comment from every check's latest run, so the comment stays right, and no run shows "cancelled" because
    # another check's report was waiting.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |  # .launchr is here only after eject
            .github
            .launchr
          persist-credentials: false
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
      # launchr-fetch-end
      - uses: ./.launchr/.github/actions/pr-report-comment
        with:
          config: .launchr/.github/pr-report.json
