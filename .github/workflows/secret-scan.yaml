
on:
  workflow_call:

name: gitleaks

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: 10  # a secrets scan (recent runs: under a minute)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # kit-fetch-start
      - name: Fetch the kit at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .kit
      # kit-fetch-end
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: not required for repos on a personal account.
          # No pull-request comments: a fork's token is read-only, so a comment would fail the scan.
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Write the report
        if: always()
        env:
          STATUS: ${{ job.status }}
          OUT: ${{ runner.temp }}/report-part.md
        run: |
          case "${STATUS}" in
            success) echo "✅ **Secret scan:** passed." > "${OUT}" ;;
            cancelled) echo "⏹️ **Secret scan:** cancelled." > "${OUT}" ;;
            *) echo "❌ **Secret scan:** failed (see the run's log)." > "${OUT}" ;;
          esac

      - name: Keep the report
        if: always()
        uses: ./.kit/.github/actions/pr-report-part
        with:
          name: tests-4-secret-scan
          file: ${{ runner.temp }}/report-part.md

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summary only: their token can't write to the pull request.
  report:
    needs: gitleaks
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request, across the workflows that write the comment.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |  # .kit is here only after eject
            .github
            .kit
          persist-credentials: false
      # kit-fetch-start
      - name: Fetch the kit at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .kit
      # kit-fetch-end
      - uses: ./.kit/.github/actions/pr-report-comment
        with:
          config: .kit/.github/pr-report.json
