# Derived from https://github.com/r-lib/actions/tree/v2/examples (pkgdown.yaml).
# Builds the pkgdown site from main only: on every push to main, and by hand on main. Never on pull
# requests: a site build may need packages that pull requests from outside contributors can't install. Deploys the
# site to GitHub Pages (the repository's Pages source is "GitHub Actions").
on:
  workflow_call:

name: pkgdown

permissions:
  contents: read  # the most this workflow can use; a job that needs more asks for it itself

jobs:
  pkgdown:
    # A run started by hand on another branch does nothing: the site is built from the default branch only (main or
    # master).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: 45  # renders the site, then deploys (1-2 min), plus room for a slow package mirror (installing R
    # alone once took 22 min here)
    permissions:
      contents: read
      pages: write     # publish to GitHub Pages
      id-token: write  # proves to Pages that this workflow made the site
    # No `environment: github-pages` here: GitHub gives that environment a rule that only `main` may deploy, so a
    # package on `master` (as usethis::use_git() can make it) would stop before its first step. The deploy works
    # without it; the run's summary links the site.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
      # launchr-fetch-end

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::checkmate, any::cli, local::.
          needs: website

      - name: Check the site configuration
        run: Rscript -e 'pkgdown::check_pkgdown()'

      # build-site.R keeps CLAUDE.md and AGENTS.md out of the site (pkgdown renders every top-level .md).
      - name: Build the site
        run: Rscript .launchr/.github/scripts/build-site.R

      # A private repository on GitHub's free plan can't turn Pages on: the site is still built, so a broken site still
      # fails here, but it isn't published, and the run says so instead of failing.
      - name: Find out whether GitHub Pages is on
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            message="The site was built but not published: GitHub Pages is off for this repository. Turn it on in Settings, then Pages, with Source: GitHub Actions. A private repository needs a paid GitHub plan for Pages."
            echo "::notice title=Website not published::${message}"
            echo "${message}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.on == 'true'
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.on == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
