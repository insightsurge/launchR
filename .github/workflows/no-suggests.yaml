# R CMD check without the Suggests, as CRAN also checks: every use of a suggested package must be guarded. It runs the
# gate's nosuggests mode (the quality gate), which puts only what the check needs on the library path: the hard
# dependencies with everything they need, testthat and the vignette builders. A Suggests package that is installed but
# not needed stays hidden, so the check holds whatever the library contains. Derived from r-lib/actions'
# check-no-suggests example. A pull request that changes only documentation starts the job and skips its steps
# (.github/scripts/r-changes.sh).
on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Longest a job may run, in minutes; 0 keeps launchR's default (90)
        type: number
        default: 0

name: no-suggests

permissions:
  contents: read  # the most this workflow can use; a job that needs more asks for it itself

jobs:
  no-suggests:
    runs-on: ubuntu-26.04  # pinned, like the repo's other workflows
    timeout-minutes: ${{ inputs.timeout-minutes > 0 && inputs.timeout-minutes || 90 }}  # it installs its packages without a cache, so a slow package mirror makes it long; usually
    # 1-3 min

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
      # launchr-fetch-end

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .launchr/.github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          dependencies: '"hard"'
          # A fresh library each time; the gate hides what the check doesn't need anyway.
          cache: false
          # The gate's own needs in its nosuggests mode (quality-gate.R, needs_for()), then the check's.
          extra-packages: |
            any::checkmate
            any::cli
            any::jsonlite
            any::pkgbuild
            any::processx
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
          needs: check

      # The gate starts R CMD check itself, with NOT_CRAN unset, _R_CHECK_FORCE_SUGGESTS_ false and the CRAN-incoming
      # checks off (R-CMD-check runs the local ones); any note other than the one listing the hidden Suggests fails it.
      # The step skips when it cannot hide the Suggests (one installed in R's own library), which here must fail the
      # job too.
      - name: R CMD check with only what the check needs (the gate's nosuggests mode)
        if: steps.changes.outputs.r == 'true'
        env:
          # The whole test output when a test fails, not only its last 13 lines.
          _R_CHECK_TESTS_NLINES_: 0
        # bash with pipefail: without it, the gate's exit status is lost in the pipe to tee and a failure looks passed.
        shell: bash
        run: |
          Rscript .launchr/quality-gate/quality-gate.R nosuggests | tee "${RUNNER_TEMP}/gate.txt"
          if grep -q "^SKIP nosuggests" "${RUNNER_TEMP}/gate.txt"; then
            echo "The no-Suggests check was skipped, so nothing was checked."
            exit 1
          fi

      - name: Write the report
        if: always()
        env:
          STATUS: ${{ job.status }}
          OUT: ${{ runner.temp }}/report-part.md
        run: |
          case "${STATUS}" in
            success) echo "✅ **No Suggests:** passed." > "${OUT}" ;;
            cancelled) echo "⏹️ **No Suggests:** cancelled." > "${OUT}" ;;
            *) echo "❌ **No Suggests:** failed (see the run's log)." > "${OUT}" ;;
          esac

      - name: Keep the report
        if: always()
        uses: ./.launchr/.github/actions/pr-report-part
        with:
          name: tests-3-no-suggests
          file: ${{ runner.temp }}/report-part.md

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summary only: their token can't write to the pull request.
  report:
    needs: no-suggests
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request and check: a newer one replaces a waiting older one. Each rewrites the
    # whole comment from every check's latest run, so the comment stays right, and no run shows "cancelled" because
    # another check's report was waiting.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |  # .launchr is here only after eject
            .github
            .launchr
          persist-credentials: false
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
      # launchr-fetch-end
      - uses: ./.launchr/.github/actions/pr-report-comment
        with:
          config: .launchr/.github/pr-report.json
