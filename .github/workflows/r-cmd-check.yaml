# Derived from https://github.com/r-lib/actions/tree/v2/examples (check-standard.yaml).
# The repo rule is 0 errors, 0 warnings, 0 notes, so any note fails the check. R CMD check as CRAN runs it: what it
# runs and when, the time limit and its line in the CI report are in .github/workflows/README.md.
on:
  workflow_call:
    inputs:
      platforms:
        description: Systems and R versions, as system/R version, comma separated
        type: string
        default: ubuntu/release
      test-time-limit:
        description: Longest test run allowed on ubuntu with R release, in seconds; 0 turns it off
        type: number
        default: 180

name: R-CMD-check

permissions: read-all

jobs:
  platforms:
    # Turns the `platforms` input, such as "ubuntu/release, windows/4.1", into the job matrix.
    runs-on: ubuntu-26.04
    outputs:
      config: ${{ steps.parse.outputs.config }}
    steps:
      - id: parse
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          runners = {"ubuntu": "ubuntu-26.04", "windows": "windows-latest", "macos": "macos-latest"}
          config = []
          for entry in os.environ["PLATFORMS"].replace(chr(10), ",").split(","):
              entry = entry.strip()
              if not entry:
                  continue
              system, _, r = entry.partition("/")
              if system not in runners or not r:
                  sys.exit(f"Can't read platform '{entry}'. Write system/R version, such as ubuntu/release.")
              row = {"os": runners[system], "r": r}
              if r == "devel":
                  row["http-user-agent"] = "release"
              config.append(row)
          if not config:
              sys.exit("The platforms input is empty.")
          print("config=" + json.dumps(config))
          PY

  check:
    needs: platforms
    runs-on: ${{ matrix.config.os }}
    outputs:
      # Whether the R steps ran (false for a pull request that changes only documentation), for the report line.
      r: ${{ steps.changes.outputs.r }}
    timeout-minutes: 120  # room for a slow day: R 4.1 with a cold cache once took 42 min, and installing R from a slow
    # package mirror can take 20 min; usually 1-3 min

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.platforms.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base, for r-changes.sh
      # kit-fetch-start
      - name: Fetch the kit at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/r-pkg-kit
          ref: ${{ job.workflow_sha }}
          path: .kit
      # kit-fetch-end

      - name: Find out whether the R steps are needed
        id: changes
        run: bash .kit/.github/scripts/r-changes.sh

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.changes.outputs.r == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.changes.outputs.r == 'true'
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.changes.outputs.r == 'true'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Note when the check starts
        if: steps.changes.outputs.r == 'true'
        shell: bash
        run: echo "CHECK_START=$(date +%s)" >> "${GITHUB_ENV}"

      - uses: r-lib/actions/check-r-package@v2
        if: steps.changes.outputs.r == 'true'
        env:
          # Skip only the remote CRAN-incoming checks: they always give a "New submission" note for an
          # unreleased package (explained in cran-comments.md when we submit).
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          # As CRAN: setup-r sets NOT_CRAN to true, which would run the browser tests here too.
          NOT_CRAN: false
          # As CRAN: a note when the tests use more than 2.5 times as much CPU time as elapsed time. testthat runs the
          # test files in two processes (Config/testthat/parallel in DESCRIPTION), which uses about twice as much.
          _R_CHECK_TEST_TIMING_CPU_TO_ELAPSED_THRESHOLD_: 2.5
          # The whole test output when a test fails, not only its last 13 lines.
          _R_CHECK_TESTS_NLINES_: 0
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      # Each platform's times for the CI report, and the time limit on one runner (.github/workflows/README.md, "The
      # time limit").
      - name: Note the check's times
        if: always() && steps.changes.outputs.r == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.config.os }}, R ${{ matrix.config.r }}
          STATUS: ${{ job.status }}
          LIMIT_SECONDS: ${{ matrix.config.os == 'ubuntu-26.04' && matrix.config.r == 'release' && inputs.test-time-limit > 0 && inputs.test-time-limit || '' }}
          OUT: ${{ runner.temp }}/check-time-${{ strategy.job-index }}.txt
        run: bash .kit/.github/scripts/check-times.sh note

      - name: Keep the check's times
        if: always() && steps.changes.outputs.r == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: check-time-${{ strategy.job-index }}
          path: ${{ runner.temp }}/check-time-${{ strategy.job-index }}.txt
          if-no-files-found: ignore
          overwrite: true  # a re-run job replaces it

  # One stable check name that sums up the jobs above (a branch ruleset could require it): it fails unless every
  # matrix job above succeeded.
  R-CMD-check:
    needs: check
    if: always()
    runs-on: ubuntu-26.04
    name: R-CMD-check
    timeout-minutes: 5  # reads the matrix result and the platforms' times
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      # kit-fetch-start
      - name: Fetch the kit at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/r-pkg-kit
          ref: ${{ job.workflow_sha }}
          path: .kit
      # kit-fetch-end

      - name: Get the platforms' times
        uses: actions/download-artifact@v8
        continue-on-error: true  # none when the R steps were skipped or every check stopped first
        with:
          pattern: check-time-*
          merge-multiple: true
          path: ${{ runner.temp }}/check-times

      # Plain shell: this job's runner has no R.
      - name: Write the report
        env:
          DIR: ${{ runner.temp }}/check-times
          RESULT: ${{ needs.check.result }}
          R_STEPS: ${{ needs.check.outputs.r }}
          OUT: ${{ runner.temp }}/check-part.md
        run: bash .kit/.github/scripts/check-times.sh report

      - name: Keep the report
        uses: ./.kit/.github/actions/pr-report-part
        with:
          name: tests-0-check
          file: ${{ runner.temp }}/check-part.md

      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "Matrix result: ${RESULT}"
          test "${RESULT}" = "success"

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summaries only: their token can't write to the pull request.
  report:
    needs: [check, R-CMD-check]  # after the summary job too, so the run counts as finished
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request, across the workflows that write the comment.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      # kit-fetch-start
      - name: Fetch the kit at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/r-pkg-kit
          ref: ${{ job.workflow_sha }}
          path: .kit
      # kit-fetch-end
      - uses: ./.kit/.github/actions/pr-report-comment
        with:
          config: .kit/.github/pr-report.json
