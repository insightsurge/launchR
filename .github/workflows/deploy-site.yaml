# Publishes the site to Firebase Hosting when main changes anything the site is built from. Signs in to Google
# with a short-lived GitHub token, so no key is stored. Skipped until the repository variables are set.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - template/**
      - lists/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-site.yaml
  workflow_dispatch:

name: deploy-site

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Builds with the repository's npm packages and only the right to read, so nothing they run can ask Google for a token.
  build:
    if: github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # an install and a static build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        run: |
          npm --prefix site ci
          npm --prefix site run build

      - name: Keep the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
          retention-days: 1

  # The only job that can sign in to Google: it runs no npm install of the site, only the built files and firebase-tools.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15  # a download and an upload
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site/dist

      - name: Sign in to Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # firebase-tools comes from its own small folder with a lockfile, installed with its install scripts off (it
      # works without them), so nothing downloaded here runs code before the deploy while this job can sign in.
      - name: Install firebase-tools
        run: npm ci --ignore-scripts --prefix tools/firebase

      - name: Publish
        run: tools/firebase/node_modules/.bin/firebase deploy --only hosting --non-interactive
