# Runs the gate's lint mode (the quality gate): Air formatting, Biome on JS/CSS in inst/, docs in
# sync with roxygen, lintr, \value on exported functions, spelling. R CMD check doesn't cover these.
# lintr's findings show inline in a pull request's "Files changed"; the result is the Code style part of the pull
# request's CI report (.github/pr-report.json).
on:
  workflow_call:
    inputs:
      ci-report:
        description: Post the CI report comment on pull requests (one comment for every check that reports); false leaves it out, and each run's results stay in its job summary
        type: boolean
        default: true

name: lint

permissions:
  contents: read  # the most this workflow can use; a job that needs more asks for it itself

jobs:
  lint:
    runs-on: ubuntu-26.04  # a fixed image (the Windows and macOS runners in the matrix workflows float with "latest")
    timeout-minutes: 45  # Air, Biome and lintr (about a minute), plus room for a slow package mirror (installing R
    # alone once took 22 min here)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
          persist-credentials: false
      # launchr-fetch-end

      - uses: posit-dev/setup-air@cf390573ff4fe0f198f35df3a642b1409328d859 # v1.0.1
        with:
          version: "0.11.0"   # keep in step with the local install (air --version)

      # Biome runs when inst/ has JS or CSS and the package has a biome.json, as in the gate. Its version comes from that
      # biome.json, so a launchR update can't clash with it.
      - name: Read Biome's version
        id: biome
        if: hashFiles('biome.json') != '' && hashFiles('inst/**/*.js', 'inst/**/*.css') != ''
        run: |
          version=$(sed -n 's|.*schemas/\([0-9.]*\)/schema.json.*|\1|p' biome.json | head -n 1)
          if [ -z "${version}" ]; then
            echo "::error file=biome.json::No Biome version found: biome.json needs a \"\$schema\" line such as \"https://biomejs.dev/schemas/2.2.0/schema.json\", which says which Biome to install."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        if: hashFiles('biome.json') != '' && hashFiles('inst/**/*.js', 'inst/**/*.css') != ''
        with:
          version: ${{ steps.biome.outputs.version }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::roxygen2, any::lintr, any::spelling, any::checkmate, any::cli
          needs: lint

      - name: Gate (lint mode)
        id: gate
        # The run folder in a known place, so the report can read the gate's results (gate.json).
        run: Rscript .launchr/quality-gate/quality-gate.R lint --out "${RUNNER_TEMP}/gate"

      - name: Write the lint report
        if: always()
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          GATE_DIR: ${{ runner.temp }}/gate
          OUT: ${{ runner.temp }}/lint-part.md
        run: |
          case "${OUTCOME}" in
            success) echo "✅ **Lint:** passed (Air, Biome, lintr, docs in sync, spelling)." > "${OUT}" ;;
            cancelled) echo "⏹️ **Lint:** cancelled before the gate finished." > "${OUT}" ;;
            failure)
              # The gate's failed steps, by name, with the first line of what each found (gate.json in its run folder).
              json=$(find "${GATE_DIR}" -mindepth 2 -maxdepth 2 -name gate.json 2>/dev/null | sort | head -n 1 || true)
              failed=""
              if [ -n "${json}" ]; then
                # The detail is text from the package's own files, so it goes in a code block (no mentions or links) with
                # its backticks swapped for apostrophes, so it cannot close the block.
                failed=$(jq -r '.steps[] | select(.status == "FAIL") | "\(.step): \(.detail | split("\n")[0] | gsub("`"; "\u0027") | .[0:200])"' "${json}")
              fi
              if [ -n "${failed}" ]; then
                {
                  echo "❌ **Lint:** failed: $(jq -r '[.steps[] | select(.status == "FAIL") | .step] | join(", ")' "${json}"). lintr's findings are also shown inline in Files changed."
                  echo
                  echo "<details open>"
                  echo "<summary>What each failed step found</summary>"
                  echo
                  echo '```text'
                  echo "${failed}"
                  echo '```'
                  echo
                  echo "</details>"
                } > "${OUT}"
              else
                echo "❌ **Lint:** failed. lintr's findings are shown inline in Files changed; the gate's FAIL lines in the run's log name the other steps." > "${OUT}"
              fi
              ;;
            *) echo "❌ **Lint:** did not run: the job failed while setting up (see the run's log)." > "${OUT}" ;;
          esac

      - name: Keep the lint report
        if: always()
        uses: ./.launchr/.github/actions/pr-report-part
        with:
          name: style-1-lint
          file: ${{ runner.temp }}/lint-part.md

  # Rewrites the pull request's CI report comment (.github/actions/pr-report-comment). Pull requests from forks and
  # from Dependabot get the job summary only: their token can't write to the pull request.
  report:
    needs: lint
    if: >-
      always() && inputs.ci-report && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10  # a few API calls
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # One report job at a time per pull request and check: a newer one replaces a waiting older one. Each rewrites the
    # whole comment from every check's latest run, so the comment stays right, and no run shows "cancelled" because
    # another check's report was waiting.
    concurrency:
      group: pr-report-${{ github.event.pull_request.number }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |  # .launchr is here only after eject
            .github
            .launchr
          persist-credentials: false
      # launchr-fetch-start
      - name: Fetch launchR at this workflow's version
        uses: actions/checkout@v7
        with:
          repository: insightsurge/launchR
          ref: ${{ job.workflow_sha }}
          path: .launchr
          persist-credentials: false
      # launchr-fetch-end
      - uses: ./.launchr/.github/actions/pr-report-comment
        with:
          config: .launchr/.github/pr-report.json
