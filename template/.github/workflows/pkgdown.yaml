# Builds the website and publishes it to GitHub Pages. In the repository's settings, set Pages to "GitHub Actions".
name: pkgdown

on:
  push:
    branches: [{{branches}}]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops this check's older run for it; pushes and weekly runs are never stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    uses: insightsurge/launchR/.github/workflows/pkgdown.yaml@v{{kit_version}}
    permissions:
      contents: read
      pages: write
      id-token: write
