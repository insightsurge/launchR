# A full check on other systems, including any detailed tests you have marked.
# How this file works: see README.md in this folder.
name: extended-tests

on:
{{c_extended_tests_pr}}  pull_request:
{{c_extended_tests_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_extended_tests_push}}  push:
{{c_extended_tests_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_extended_tests_weekly}}  schedule:
{{c_extended_tests_weekly}}    - cron: "{{cron_extended_tests}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_extended_tests_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/extended-tests.yaml@v{{kit_version}}
    with:
      # One entry per run, as system/R version, comma separated. System: ubuntu, windows, macos.
      # R version: release, devel, oldrel-1, or a number such as 4.1. R 4.1 on macos may fail: it has no ready-built packages.
      platforms: {{platforms_extended_tests}}
