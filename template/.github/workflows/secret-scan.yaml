# Catches passwords and tokens committed by mistake. Linux only.
# How this file works: see README.md in this folder.
name: secret-scan

on:
{{c_secret_scan_pr}}  pull_request:
{{c_secret_scan_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_secret_scan_push}}  push:
{{c_secret_scan_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_secret_scan_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  actions: read   # lets CI read the other checks' results for its report
  pull-requests: write   # lets CI post its report on the PR

# A new push to a pull request stops this check's older run for it, to save minutes; pushes and weekly runs always
# finish. To let every pull request run finish too, set cancel-in-progress to false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/secret-scan.yaml@v{{kit_version}}
    with:
      ci-report: {{ci_report}}   # the CI report comment on pull requests: true posts it, false leaves it out
