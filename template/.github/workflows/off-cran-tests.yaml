# Runs the tests CRAN skips: browser, snapshot and extended test files, with Chrome.
# How this file works: see README.md in this folder.
name: off-cran-tests

on:
{{c_off_cran_tests_pr}}  pull_request:
{{c_off_cran_tests_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_off_cran_tests_push}}  push:
{{c_off_cran_tests_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_off_cran_tests_schedule}}  schedule:
{{c_off_cran_tests_schedule}}    - cron: "{{cron_off_cran_tests}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_off_cran_tests_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  actions: read   # lets CI read the other checks' results for its report
  pull-requests: write   # lets CI post its report on the PR

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/off-cran-tests.yaml@v{{kit_version}}
    with:
      # One entry per run, as system/R version, comma separated. System: ubuntu, windows, macos.
      # R version: release, devel, oldrel-1, or a number such as 4.1. R 4.1 on macos may fail: it has no ready-built packages.
      platforms: {{platforms_off_cran_tests}}
