# Style, docs in sync and spelling. Linux only.
# How this file works: see README.md in this folder.
name: lint

on:
{{c_lint_pr}}  pull_request:
{{c_lint_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_lint_push}}  push:
{{c_lint_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_lint_weekly}}  schedule:
{{c_lint_weekly}}    - cron: "{{cron_lint}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_lint_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  pull-requests: write   # lets CI post its report on the PR

jobs:
  check:
    uses: insightsurge/r-pkg-kit/.github/workflows/lint.yaml@v{{kit_version}}
    with:
      js-css-tests: {{js_css_tests}}   # also check the style of JavaScript and CSS in inst/ with Biome
