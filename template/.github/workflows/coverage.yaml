# Measures how much code your tests run; the limit is in DESCRIPTION. Linux only.
# How this file works: see README.md in this folder.
name: coverage

on:
{{c_coverage_pr}}  pull_request:
{{c_coverage_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_coverage_push}}  push:
{{c_coverage_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_coverage_schedule}}  schedule:
{{c_coverage_schedule}}    - cron: "{{cron_coverage}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_coverage_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  actions: read   # lets CI read the other checks' results for its report
  pull-requests: write   # lets CI post its report on the PR

# A new push to a pull request stops this check's older run for it, to save minutes; pushes and weekly runs always
# finish. To let every pull request run finish too, set cancel-in-progress to false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/coverage.yaml@v{{kit_version}}
    with:
      ci-report: {{ci_report}}   # the CI report comment on pull requests: true posts it, false leaves it out
      timeout-minutes: 0   # longest the job may run, in minutes; 0 keeps launchR's default: 60
    # To send results to Codecov, add a CODECOV_TOKEN secret and uncomment these lines at job level:
    # secrets:
    #   CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
