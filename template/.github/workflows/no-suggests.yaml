# Checks the package works without its optional packages. Linux only.
# How this file works: see README.md in this folder.
name: no-suggests

on:
{{c_no_suggests_pr}}  pull_request:
{{c_no_suggests_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_no_suggests_push}}  push:
{{c_no_suggests_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_no_suggests_schedule}}  schedule:
{{c_no_suggests_schedule}}    - cron: "{{cron_no_suggests}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_no_suggests_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  actions: read   # lets CI read the other checks' results for its report
  pull-requests: write   # lets CI post its report on the PR

# A new push to a pull request stops this check's older run for it, to save minutes; pushes and weekly runs always
# finish. To let every pull request run finish too, set cancel-in-progress to false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/no-suggests.yaml@v{{kit_version}}
    with:
      timeout-minutes: 0   # longest the job may run, in minutes; 0 keeps launchR's default: 90
