# R CMD check on other systems, with the extended tests (test files ending in -extended.R).
# How this file works: see README.md in this folder.
name: r-cmd-check-extended

on:
{{c_r_cmd_check_extended_pr}}  pull_request:
{{c_r_cmd_check_extended_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_r_cmd_check_extended_push}}  push:
{{c_r_cmd_check_extended_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_r_cmd_check_extended_schedule}}  schedule:
{{c_r_cmd_check_extended_schedule}}    - cron: "{{cron_r_cmd_check_extended}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_r_cmd_check_extended_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read

# A new push to a pull request stops this check's older run for it; pushes and weekly runs are never stopped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/r-cmd-check-extended.yaml@v{{kit_version}}
    with:
      # One entry per run, as system/R version, comma separated. System: ubuntu, windows, macos.
      # R version: release, devel, oldrel-1, or a number such as 4.1. R 4.1 on macos may fail: it has no ready-built packages.
      platforms: {{platforms_r_cmd_check_extended}}
