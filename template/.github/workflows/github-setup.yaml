# The "Run workflow" button: creates labels, the root issue and the checklists. Safe to run again.
# Repository settings can't be changed from here: the checklists link to them. Most settings can't be read with this
# token either, so those boxes are left as they are until you run the same command from your own computer.
# It also runs by itself, as a dry run that changes nothing, when this file is pushed: GitHub shows the Run workflow button
# only after a workflow has run once, and the log shows what a real run would do.
name: Set up this repository

on:
  push:
    branches: [{{branches}}]
    paths: [.github/workflows/github-setup.yaml]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show what would change
        type: boolean
        default: true
      remove-other-labels:
        description: Also remove labels that aren't launchR's, such as GitHub's own
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  checks: read

jobs:
  setup:
    uses: insightsurge/launchR/.github/workflows/github-setup.yaml@v{{kit_version}}
    with:
      dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
      remove-other-labels: ${{ github.event_name == 'workflow_dispatch' && inputs.remove-other-labels }}
