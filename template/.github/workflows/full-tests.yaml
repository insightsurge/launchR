# Runs every test, including the browser, snapshot and extended tests CRAN skips, with Chrome for browser tests.
# How this file works: see README.md in this folder.
name: full-tests

on:
{{c_full_tests_pr}}  pull_request:
{{c_full_tests_pr}}    branches: [{{branches}}]   # PRs that merge into these branches
    # Example: branches: [main, develop, "release/**"]
{{c_full_tests_push}}  push:
{{c_full_tests_push}}    branches: [{{branches}}]   # pushes to these branches
{{c_full_tests_schedule}}  schedule:
{{c_full_tests_schedule}}    - cron: "{{cron_full_tests}}"   # times are UTC; runs from the default branch only
    # Examples: "0 5 * * *" every day at 05:00, "0 5 1 * *" the 1st of every month at 05:00
{{c_full_tests_manual}}  workflow_dispatch:   # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  actions: read   # lets CI read the other checks' results for its report
  pull-requests: write   # lets CI post its report on the PR

# A new push to a pull request stops this check's older run for it, to save minutes; pushes and weekly runs always
# finish. To let every pull request run finish too, set cancel-in-progress to false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: insightsurge/launchR/.github/workflows/full-tests.yaml@v{{kit_version}}
    with:
      ci-report: {{ci_report}}   # the CI report comment on pull requests: true posts it, false leaves it out
      # One entry per run, as system/R version, comma separated. System: ubuntu, windows, macos.
      # R version: release, devel, oldrel-1, or a number such as 4.1. R 4.1 on macos may fail: it has no ready-built packages.
      platforms: {{platforms_full_tests}}
      timeout-minutes: 0   # longest a job may run, in minutes; 0 keeps launchR's default: 60 on Mac, 120 elsewhere
